include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "build/**"
    - "social_media_v6_enterprise_audit_fix_issuse_and add CI CD/**"
  errors:
    # عدم إيقاف البناء بسبب دوال أو بارامترات غير مستخدمة في كود قديم
    unused_element: info
    unused_element_parameter: info
    deprecated_member_use: info
    unawaited_futures: ignore
    todo: ignore

linter:
  rules:
    - avoid_empty_else
    - close_sinks
    - use_build_context_synchronously